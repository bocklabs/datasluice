name: Publish package

on:
  workflow_call:
    inputs: &publish-inputs
      component:
        required: true
        type: string
      package_path:
        required: true
        type: string
      package_name:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      testpypi_environment:
        required: true
        type: string
      pypi_environment:
        required: true
        type: string
  workflow_dispatch:
    inputs: *publish-inputs

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ref is the release tag
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="refs/tags/${PACKAGE_NAME}-v${VERSION}"
          expected="$(git rev-parse "${tag}^{commit}" 2>/dev/null)" || {
            echo "Release tag ${tag} not found" >&2
            exit 1
          }
          test "${expected}" = "$(git rev-parse HEAD)" || {
            echo "HEAD does not match ${tag}" >&2
            exit 1
          }
      - name: Guard publish inputs
        env:
          COMPONENT: ${{ inputs.component }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          TESTPYPI_ENVIRONMENT: ${{ inputs.testpypi_environment }}
          PYPI_ENVIRONMENT: ${{ inputs.pypi_environment }}
        run: |
          case "${COMPONENT}:${PACKAGE_NAME}:${PACKAGE_PATH}:${TESTPYPI_ENVIRONMENT}:${PYPI_ENVIRONMENT}" in
            core:datasluice:.:test-pypi:pypi | airflow:apache-airflow-providers-datasluice:providers/apache-airflow:airflow-test-pypi:airflow-pypi) ;;
            *)
              echo "Unexpected component/package/path/environments: ${COMPONENT}/${PACKAGE_NAME}/${PACKAGE_PATH}/${TESTPYPI_ENVIRONMENT}/${PYPI_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Build distribution
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: uv build --no-sources --out-dir dist "$PACKAGE_PATH"
      - run: uvx twine check dist/*
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.testpypi_environment }}
      url: https://test.pypi.org/p/${{ inputs.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SMOKE_VENV: /tmp/smoke-${{ inputs.component }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Smoke-test installed package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" --index-strategy unsafe-best-match --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "${PACKAGE_NAME}==${PACKAGE_VERSION}"
      - if: inputs.package_name == 'datasluice'
        run: |
          "$SMOKE_VENV/bin/python" -c "import datasluice"
          "$SMOKE_VENV/bin/datasluice" --help
      - if: inputs.package_name != 'datasluice'
        working-directory: ${{ inputs.package_path }}
        run: '"$SMOKE_VENV/bin/python" tests/smoke.py'

  publish-pypi:
    needs: [build, publish-testpypi, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.pypi_environment }}
      url: https://pypi.org/p/${{ inputs.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
