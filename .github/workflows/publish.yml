name: Publish

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      package_path:
        required: true
        type: string
      package_name:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      testpypi_environment:
        required: true
        type: string
      pypi_environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & attest ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Build distribution from exact ref
        working-directory: ${{ inputs.package_path }}
        run: uv build --no-sources

      - name: Validate distribution
        working-directory: ${{ inputs.package_path }}
        run: uvx twine check dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "${{ inputs.package_path }}/dist/*"

      - name: Upload unique distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: ${{ inputs.package_path }}/dist/

  publish-testpypi:
    name: Publish ${{ inputs.component }} to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.testpypi_environment }}
      url: https://test.pypi.org/p/${{ inputs.package_name }}
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          password: ${{ secrets.TEST_PYPI_API_KEY }}
          repository-url: https://test.pypi.org/legacy/

  smoke:
    name: Smoke ${{ inputs.component }} candidate
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_VENV: /tmp/smoke-${{ inputs.component }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install exact candidate from TestPyPI
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "${{ inputs.package_name }}==${{ inputs.version }}"

      - name: Smoke core public facade and CLI
        if: inputs.package_name == 'datasluice'
        run: |
          "$SMOKE_VENV/bin/python" -c "import datasluice; from datasluice import DataSluice; print(datasluice.__version__)"
          "$SMOKE_VENV/bin/datasluice" --help

      - name: Smoke provider via convention tests/smoke.py
        if: inputs.package_name != 'datasluice'
        working-directory: ${{ inputs.package_path }}
        run: |
          "$SMOKE_VENV/bin/python" tests/smoke.py

  publish-pypi:
    name: Publish ${{ inputs.component }} to PyPI
    needs: [build, publish-testpypi, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.pypi_environment }}
      url: https://pypi.org/p/${{ inputs.package_name }}
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/

      - name: Publish attested artifact to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          password: ${{ secrets.PYPI_API_KEY }}
