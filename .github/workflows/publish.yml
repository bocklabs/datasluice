name: Publish

on:
  workflow_run:
    workflows:
      - Release Please
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read release manifest
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.manifest.outputs.core }}
      providers: ${{ steps.manifest.outputs.providers }}
      has-core: ${{ steps.manifest.outputs.has-core }}
      has-providers: ${{ steps.manifest.outputs.has-providers }}
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: release-manifest/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse release manifest
        id: manifest
        env:
          MANIFEST_PATH: release-manifest/release-manifest.json
        run: |
          python3 -c '
          import json, os
          with open(os.environ["MANIFEST_PATH"], encoding="utf-8") as f:
              manifest = json.load(f)
          core = manifest.get("core") or {}
          providers = manifest.get("providers") or []
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"core={json.dumps(core, separators=(chr(44), chr(58)))}\n")
              f.write(f"providers={json.dumps(providers, separators=(chr(44), chr(58)))}\n")
              f.write(f"has-core={str(bool(core)).lower()}\n")
              f.write(f"has-providers={str(bool(providers)).lower()}\n")
          '

  build-core:
    name: Build core
    needs: prepare
    if: needs.prepare.outputs.has-core == 'true'
    uses: ./.github/workflows/build-distribution.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      component: core
      package_path: ${{ fromJson(needs.prepare.outputs.core).path }}
      version: ${{ fromJson(needs.prepare.outputs.core).version }}
      ref: ${{ fromJson(needs.prepare.outputs.core).tag_name }}

  publish-core-testpypi:
    name: Publish core to TestPyPI
    needs: [prepare, build-core]
    if: needs.prepare.outputs.has-core == 'true' && needs.build-core.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/datasluice
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-core-${{ fromJson(needs.prepare.outputs.core).version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-core:
    name: Smoke core candidate
    needs: [prepare, build-core, publish-core-testpypi]
    if: needs.prepare.outputs.has-core == 'true' && needs.publish-core-testpypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_VENV: /tmp/smoke-core
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ fromJson(needs.prepare.outputs.core).tag_name }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install exact candidate from TestPyPI
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" \
            --index-strategy unsafe-first-match \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "datasluice==${{ fromJson(needs.prepare.outputs.core).version }}"

      - name: Smoke core public facade and CLI
        run: |
          "$SMOKE_VENV/bin/python" -c "import datasluice; from datasluice import DataSluice; print(datasluice.__version__)"
          "$SMOKE_VENV/bin/datasluice" --help

  publish-core-pypi:
    name: Publish core to PyPI
    needs: [prepare, build-core, publish-core-testpypi, smoke-core]
    if: needs.prepare.outputs.has-core == 'true' && needs.smoke-core.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/datasluice
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-core-${{ fromJson(needs.prepare.outputs.core).version }}
          path: dist/

      - name: Publish attested artifact to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  build-providers:
    name: Build provider ${{ matrix.provider.slug }}
    needs: [prepare, publish-core-pypi]
    if: always() && needs.prepare.outputs.has-providers == 'true' && (needs.prepare.outputs.has-core != 'true' || needs.publish-core-pypi.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.prepare.outputs.providers) }}
    uses: ./.github/workflows/build-distribution.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      component: ${{ matrix.provider.slug }}
      package_path: ${{ matrix.provider.path }}
      version: ${{ matrix.provider.version }}
      ref: ${{ matrix.provider.tag_name }}

  publish-providers-testpypi:
    name: Publish provider ${{ matrix.provider.slug }} to TestPyPI
    needs: [prepare, build-providers]
    if: always() && needs.prepare.outputs.has-providers == 'true' && needs.build-providers.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.prepare.outputs.providers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ matrix.provider.testpypi_env }}
      url: https://test.pypi.org/p/${{ matrix.provider.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.provider.slug }}-${{ matrix.provider.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-providers:
    name: Smoke provider ${{ matrix.provider.slug }} candidate
    needs: [prepare, build-providers, publish-providers-testpypi]
    if: always() && needs.prepare.outputs.has-providers == 'true' && needs.publish-providers-testpypi.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.prepare.outputs.providers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_VENV: /tmp/smoke-${{ matrix.provider.slug }}
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.provider.tag_name }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Install exact candidate from TestPyPI
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" \
            --index-strategy unsafe-first-match \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "${{ matrix.provider.package_name }}==${{ matrix.provider.version }}"

      - name: Smoke provider via convention tests/smoke.py
        working-directory: ${{ matrix.provider.path }}
        run: |
          "$SMOKE_VENV/bin/python" tests/smoke.py

  publish-providers-pypi:
    name: Publish provider ${{ matrix.provider.slug }} to PyPI
    needs: [prepare, build-providers, publish-providers-testpypi, smoke-providers]
    if: always() && needs.prepare.outputs.has-providers == 'true' && needs.smoke-providers.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.prepare.outputs.providers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ matrix.provider.pypi_env }}
      url: https://pypi.org/p/${{ matrix.provider.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download attested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.provider.slug }}-${{ matrix.provider.version }}
          path: dist/

      - name: Publish attested artifact to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
