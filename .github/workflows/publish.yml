name: Publish package

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      package_path:
        required: true
        type: string
      package_name:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
      testpypi_environment:
        required: true
        type: string
      pypi_environment:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Build distribution
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: uv build --no-sources "$PACKAGE_PATH"
      - run: uvx twine check dist/*
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.testpypi_environment }}
      url: https://test.pypi.org/p/${{ inputs.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SMOKE_VENV: /tmp/smoke-${{ inputs.component }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Smoke-test installed package
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "${PACKAGE_NAME}==${PACKAGE_VERSION}"
      - if: inputs.package_name == 'datasluice'
        run: |
          "$SMOKE_VENV/bin/python" -c "import datasluice"
          "$SMOKE_VENV/bin/datasluice" --help
      - if: inputs.package_name != 'datasluice'
        working-directory: ${{ inputs.package_path }}
        run: '"$SMOKE_VENV/bin/python" tests/smoke.py'

  publish-pypi:
    needs: [build, publish-testpypi, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.pypi_environment }}
      url: https://pypi.org/p/${{ inputs.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
