name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      core--release_created: ${{ steps.release.outputs.release_created }}
      core--version: ${{ steps.release.outputs.version }}
      core--tag_name: ${{ steps.release.outputs.tag_name }}
      provider-releases: ${{ steps.collect.outputs.provider-releases }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: collect
        if: always()
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          outputs = json.loads(os.environ.get("RELEASE_OUTPUTS") or "{}")
          registry = json.loads(open("providers/registry.json", encoding="utf-8").read())
          releases = []
          for provider in registry.get("providers", []):
              path = provider["path"]
              if str(outputs.get(f"{path}--release_created")).lower() != "true":
                  continue
              releases.append(
                  {
                      "slug": provider["slug"],
                      "path": path,
                      "package_name": provider["package_name"],
                      "version": outputs[f"{path}--version"],
                      "tag_name": outputs[f"{path}--tag_name"],
                      "testpypi_env": provider["testpypi_env"],
                      "pypi_env": provider["pypi_env"],
                  }
              )
          print("provider-releases=" + json.dumps(releases, separators=(",", ":")))
          PY

  publish-core-build:
    needs: release-please
    if: needs.release-please.outputs.core--release_created == 'true'
    uses: $/.github/workflows/build.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      component: core
      package_path: .
      package_name: datasluice
      version: ${{ needs.release-please.outputs.core--version }}
      ref: ${{ needs.release-please.outputs.core--tag_name }}
      testpypi_environment: test-pypi
      pypi_environment: pypi

  publish-core-testpypi:
    needs: [release-please, publish-core-build]
    if: needs.publish-core-build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/datasluice
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-core-${{ needs.release-please.outputs.core--version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-core-smoke:
    needs: [release-please, publish-core-build, publish-core-testpypi]
    if: needs.publish-core-testpypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SMOKE_VENV: /tmp/smoke-core
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.release-please.outputs.core--tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Smoke-test installed package
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.core--version }}
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" --index-strategy unsafe-best-match --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "datasluice==$PACKAGE_VERSION"
      - run: |
          "$SMOKE_VENV/bin/python" -c "import datasluice"
          "$SMOKE_VENV/bin/datasluice" --help

  publish-core-pypi:
    needs: [release-please, publish-core-build, publish-core-testpypi, publish-core-smoke]
    if: needs.publish-core-smoke.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datasluice
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-core-${{ needs.release-please.outputs.core--version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true

  publish-providers-build:
    needs: [release-please, publish-core-build]
    if: >-
      always() && needs.release-please.outputs.provider-releases != '[]' &&
      (needs.release-please.outputs.core--release_created != 'true' || needs.publish-core-build.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.release-please.outputs.provider-releases) }}
    uses: $/.github/workflows/build.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      component: ${{ matrix.provider.slug }}
      package_path: ${{ matrix.provider.path }}
      package_name: ${{ matrix.provider.package_name }}
      version: ${{ matrix.provider.version }}
      ref: ${{ matrix.provider.tag_name }}
      testpypi_environment: ${{ matrix.provider.testpypi_env }}
      pypi_environment: ${{ matrix.provider.pypi_env }}

  publish-providers-testpypi:
    needs: [release-please, publish-providers-build]
    if: >-
      always() && needs.publish-providers-build.result == 'success' &&
      needs.release-please.outputs.provider-releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.release-please.outputs.provider-releases) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.provider.testpypi_env }}
      url: https://test.pypi.org/p/${{ matrix.provider.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ matrix.provider.slug }}-${{ matrix.provider.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-providers-smoke:
    needs: [release-please, publish-providers-build, publish-providers-testpypi]
    if: >-
      always() && needs.publish-providers-testpypi.result == 'success' &&
      needs.release-please.outputs.provider-releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.release-please.outputs.provider-releases) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SMOKE_VENV: /tmp/smoke-${{ matrix.provider.slug }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.provider.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Smoke-test installed package
        env:
          PACKAGE_NAME: ${{ matrix.provider.package_name }}
          PACKAGE_VERSION: ${{ matrix.provider.version }}
        run: |
          uv venv --python 3.12 "$SMOKE_VENV"
          uv pip install --python "$SMOKE_VENV/bin/python" --index-strategy unsafe-best-match --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "$PACKAGE_NAME==$PACKAGE_VERSION"
      - name: Run provider smoke test
        working-directory: ${{ matrix.provider.path }}
        run: '"$SMOKE_VENV/bin/python" tests/smoke.py'

  publish-providers-pypi:
    needs: [release-please, publish-providers-build, publish-providers-testpypi, publish-providers-smoke]
    if: >-
      always() && needs.publish-providers-smoke.result == 'success' &&
      needs.release-please.outputs.provider-releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.release-please.outputs.provider-releases) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.provider.pypi_env }}
      url: https://pypi.org/p/${{ matrix.provider.package_name }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-${{ matrix.provider.slug }}-${{ matrix.provider.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
