name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Type check with mypy
        run: uv run --all-extras mypy

  duplication:
    name: Duplication gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Run jscpd
        run: npx --yes jscpd@4.3.0

  provider-matrix:
    name: Resolve provider compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit matrix from compatibility manifest
        id: emit
        run: |
          python - <<'PY'
          import json
          import itertools
          import re
          from pathlib import Path
          with open("providers/apache-airflow/compatibility.json", encoding="utf-8") as fh:
              manifest = json.load(fh)
          _core_match = re.search(
              r'^version\s*=\s*"([^"]+)"',
              Path("pyproject.toml").read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          assert _core_match, "could not read version from pyproject.toml"
          core_version = _core_match.group(1)
          include = [
              {"core_version": core_version, "airflow": airflow, "python": minor}
              for airflow, minor in itertools.product(manifest["airflow"], manifest["python"])
          ]
          with open("/tmp/provider-matrix.json", "w", encoding="utf-8") as fh:
              json.dump({"include": include}, fh)
          print(json.dumps({"include": include}))
          PY
          echo "matrix=$(cat /tmp/provider-matrix.json)" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      # Full history: the controlled-evidence provenance test walks git history to the
      # commit that first wrote each record, and skips itself in a shallow clone.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run core tests
        run: uv run --all-extras --python=${{ matrix.python-version }} coverage run --source=src/datasluice --branch -m pytest tests

      - name: Upload core coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-coverage-${{ matrix.python-version }}
          path: .coverage.core.*
          include-hidden-files: true
          if-no-files-found: error

  coverage-core:
    name: Core branch coverage (>= 80%)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Download core coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-coverage-*
          merge-multiple: true
          path: .coverage/

      - name: Combine core coverage
        run: uv run coverage combine --data-file=.coverage.core .coverage/
        env:
          COVERAGE_FILE: .coverage.core

      - name: Core coverage report
        run: |
          set -o pipefail
          echo '## Core Branch Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run coverage report --data-file=.coverage.core | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  provider-test:
    name: Provider ${{ matrix.airflow }} / py${{ matrix.python }}
    needs: provider-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.provider-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run provider tests (local candidate wheels)
        env:
          CANDIDATE_PYTHON: ${{ matrix.python }}
          CANDIDATE_CORE_VERSION: ${{ matrix.core_version }}
          CANDIDATE_AIRFLOW: ${{ matrix.airflow }}
        run: |
          uv run --python="$CANDIDATE_PYTHON" python providers/apache-airflow/tests/run_candidate.py \
            --core-version "$CANDIDATE_CORE_VERSION" \
            --airflow-version "$CANDIDATE_AIRFLOW" \
            -- pytest providers/apache-airflow/tests -x

  coverage-provider:
    name: Provider branch coverage (>= 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run provider suite under coverage
        run: |
          uv run python providers/apache-airflow/tests/run_candidate.py \
            --airflow-version 3.2.2 \
            -- --cover-provider providers/apache-airflow/tests -q

  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build distribution
        run: uv build

      - name: Validate distribution
        run: uvx twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  installed-wheel-e2e:
    name: Installed-wheel CLI E2E (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Installed-wheel bare CLI E2E
        run: uv run --python=${{ matrix.python-version }} pytest tests/e2e/test_cli_bare.py -x

      - name: Installed-wheel all-extras CLI E2E
        run: uv run --python=${{ matrix.python-version }} pytest tests/e2e/test_cli_existing.py -x
        env:
          DATASLUICE_E2E_EXTRAS: all

  provider-e2e:
    name: Provider installed-wheel E2E (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Smoke provider metadata from installed wheels
        run: |
          uv run --python=${{ matrix.python-version }} python providers/apache-airflow/tests/run_candidate.py \
            --airflow-version 3.2.2 \
            -- python providers/apache-airflow/tests/smoke.py

  smoke-test:
    name: Smoke test (install wheel)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Set up UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install built wheel & smoke import
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/python -c "import datasluice; print(datasluice.__version__)"

  all-checks-pass:
    name: All checks pass
    if: always()
    needs:
      - lint
      - type-check
      - duplication
      - test
      - coverage-core
      - provider-test
      - coverage-provider
      - build
      - installed-wheel-e2e
      - provider-e2e
      - smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check job results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
