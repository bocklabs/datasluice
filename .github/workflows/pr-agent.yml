name: PR Agent

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: write
  checks: write

jobs:
  pr_description:
    name: Auto-generate PR title & description (PR-Agent /describe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' }}
    steps:
      - name: PR Agent /describe
        uses: the-pr-agent/pr-agent@570f67ed5fc8db5be74c18df070bc20079b64b0d # v0.41.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: ${{ secrets.OCR_LLM_MODEL }}
          config.custom_model_max_tokens: "262000"
          config.fallback_models: '${{ vars.PR_AGENT_FALLBACK_MODEL }}'
          config.propagate_tool_errors: "true"
          OPENAI_KEY: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OPENAI.API_BASE: ${{ secrets.OCR_LLM_URL }}
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
