name: PR Agent

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr_description:
    name: Auto-generate PR title & description (PR-Agent /describe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    steps:
      - name: PR Agent /describe
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: ${{ vars.PR_AGENT_LLM_MODEL }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_LLM_AUTH_TOKEN }}
          OPENAI.API_BASE: ${{ secrets.PR_AGENT_LLM_URL }}
          config.fallback_models: '${{ vars.PR_AGENT_FALLBACK_MODEL }}'
