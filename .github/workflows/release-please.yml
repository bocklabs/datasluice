name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    outputs:
      core--release_created: ${{ steps.release.outputs.release_created }}
      core--tag_name: ${{ steps.release.outputs.tag_name }}
      core--version: ${{ steps.release.outputs.version }}
      provider-releases: ${{ steps.collect.outputs.releases }}
    steps:
      - name: Mint release-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: collect
        if: always()
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          releases=$(python3 -c '
          import json, os
          with open("providers/registry.json") as f:
              registry = json.load(f)
          outputs_raw = os.environ.get("RELEASE_OUTPUTS", "{}")
          release_outputs = json.loads(outputs_raw) if outputs_raw.strip() else {}
          releases = []
          for provider in registry.get("providers", []):
              path = provider["path"]
              if release_outputs.get(f"{path}--release_created") == "true":
                  releases.append({
                      "slug": provider["slug"],
                      "path": path,
                      "package_name": provider["package_name"],
                      "version": release_outputs[f"{path}--version"],
                      "tag_name": release_outputs[f"{path}--tag_name"],
                      "testpypi_env": provider["testpypi_env"],
                      "pypi_env": provider["pypi_env"],
                  })
          print(json.dumps(releases))
          ')
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  publish-core:
    name: Publish core
    needs: release-please
    if: needs.release-please.outputs.core--release_created == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      component: core
      package_path: .
      package_name: datasluice
      version: ${{ needs.release-please.outputs.core--version }}
      ref: ${{ needs.release-please.outputs.core--tag_name }}
      testpypi_environment: test-pypi
      pypi_environment: pypi
    secrets: inherit

  publish-providers:
    name: Publish provider ${{ matrix.provider.slug }}
    needs: [release-please, publish-core]
    if: always() && needs.release-please.outputs.provider-releases != '[]' && (needs.release-please.outputs.core--release_created != 'true' || needs.publish-core.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.release-please.outputs.provider-releases) }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      component: ${{ matrix.provider.slug }}
      package_path: ${{ matrix.provider.path }}
      package_name: ${{ matrix.provider.package_name }}
      version: ${{ matrix.provider.version }}
      ref: ${{ matrix.provider.tag_name }}
      testpypi_environment: ${{ matrix.provider.testpypi_env }}
      pypi_environment: ${{ matrix.provider.pypi_env }}
    secrets: inherit
