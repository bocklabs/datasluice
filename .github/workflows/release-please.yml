name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    outputs:
      core--release_created: ${{ steps.release.outputs.release_created }}
      core--tag_name: ${{ steps.release.outputs.tag_name }}
      core--version: ${{ steps.release.outputs.version }}
      provider--release_created: ${{ steps.release.outputs['providers/apache-airflow--release_created'] }}
      provider--tag_name: ${{ steps.release.outputs['providers/apache-airflow--tag_name'] }}
      provider--version: ${{ steps.release.outputs['providers/apache-airflow--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-core:
    name: Publish core
    needs: release-please
    if: needs.release-please.outputs.core--release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      component: core
      package_path: .
      package_name: datasluice
      version: ${{ needs.release-please.outputs.core--version }}
      ref: ${{ needs.release-please.outputs.core--tag_name }}
      testpypi_environment: core-test-pypi
      pypi_environment: core-pypi
    secrets: inherit

  publish-provider:
    name: Publish provider
    needs: [release-please, publish-core]
    if: |
      always() &&
      needs.release-please.outputs.provider--release_created == 'true' &&
      (needs.release-please.outputs.core--release_created == 'false' || needs.publish-core.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      component: provider
      package_path: providers/apache-airflow
      package_name: apache-airflow-providers-datasluice
      version: ${{ needs.release-please.outputs.provider--version }}
      ref: ${{ needs.release-please.outputs.provider--tag_name }}
      testpypi_environment: provider-test-pypi
      pypi_environment: provider-pypi
    secrets: inherit
