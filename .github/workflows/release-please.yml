name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Collect created releases
        if: always()
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          python3 -c '
          import json, os
          with open("providers/registry.json") as f:
              registry = json.load(f)
          outputs_raw = os.environ.get("RELEASE_OUTPUTS", "{}")
          release_outputs = json.loads(outputs_raw) if outputs_raw.strip() else {}
          core = None
          if release_outputs.get("release_created") == "true":
              core = {
                  "component": "core",
                  "path": ".",
                  "package_name": "datasluice",
                  "version": release_outputs["version"],
                  "tag_name": release_outputs["tag_name"],
              }
          providers = []
          for provider in registry.get("providers", []):
              path = provider["path"]
              if release_outputs.get(f"{path}--release_created") == "true":
                  providers.append({
                      "slug": provider["slug"],
                      "path": path,
                      "package_name": provider["package_name"],
                      "version": release_outputs[f"{path}--version"],
                      "tag_name": release_outputs[f"{path}--tag_name"],
                      "testpypi_env": provider["testpypi_env"],
                      "pypi_env": provider["pypi_env"],
                  })
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump({"core": core, "providers": providers}, f, separators=(",", ":"))
          '

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 1
