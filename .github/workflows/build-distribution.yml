name: Build distribution

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      package_path:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & attest ${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build distribution from exact ref
        working-directory: ${{ inputs.package_path }}
        run: uv build --no-sources

      - name: Validate distribution
        working-directory: ${{ inputs.package_path }}
        run: uvx twine check dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ inputs.package_path }}/dist/*"

      - name: Upload unique distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.component }}-${{ inputs.version }}
          path: ${{ inputs.package_path }}/dist/
