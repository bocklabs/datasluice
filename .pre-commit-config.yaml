repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      -   id: pyupgrade
          args: ["--py312-plus"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
        name: gitleaks (hardcoded secrets)

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v5.1.0
    hooks:
      - id: complexipy
        name: cognitive complexity
        args: ["--max-complexity-allowed", "15"]

  - repo: local
    hooks:
      - id: jscpd
        name: code duplication
        entry: npx --yes jscpd@4 --min-lines 10 --min-tokens 70 --threshold 1.5
          --reporters consoleFull --output /tmp/jscpd-precommit
          --ignore "**/node_modules/**,**/.venv/**,**/jscpd-report.json"
          src tests scripts providers
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: ty
        name: type check (ty)
        entry: uv run --frozen --all-extras ty check .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: tests (pytest)
        entry: uv run --frozen --all-extras pytest -q
        language: system
        types: [python]
        pass_filenames: false

      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: uvx zizmor
        language: system
        files: ^\.github/workflows/
        types: [yaml]

      - id: graphify
        name: graphify knowledge graph rebuild
        entry: graphify update .
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit, post-checkout]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
