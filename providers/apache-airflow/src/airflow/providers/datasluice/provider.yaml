package-name: apache-airflow-providers-datasluice
name: DataSluice
description: |
  Apache Airflow provider for DataSluice runtime client composition. Platform
  actions await the canonical executors of Phases 3-5.
hooks:
  - integration-name: DataSluice
    python-modules:
      - airflow.providers.datasluice.hooks
operators:
  - integration-name: DataSluice
    python-modules:
      - airflow.providers.datasluice.operators
integrations:
  - integration-name: DataSluice
    external-doc-url: https://bocklabs.github.io/datasluice/
    tags: [open-data]
