[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apache-airflow-providers-datasluice"
version = "0.1.2"
description = "Apache Airflow provider for DataSluice open-data discovery, streaming, and materialization"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Nitish Raj", email = "contact@bocklabs.com"}
]
maintainers = [
    {name = "Nitish Raj", email = "contact@bocklabs.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Typing :: Typed",
]
dependencies = [
    "datasluice>=0.2,<1",
    "apache-airflow>=3.2,<4",
]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.datasluice.get_provider_info:get_provider_info"

[project.urls]
bugs = "https://github.com/bocklabs/datasluice/issues"
changelog = "https://github.com/bocklabs/datasluice/releases"
documentation = "https://bocklabs.github.io/datasluice/"
homepage = "https://github.com/bocklabs/datasluice"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/airflow/providers/datasluice"]

[tool.hatch.build.targets.sdist]
include = [
    "src/airflow/providers/datasluice",
    "tests",
    "pyproject.toml",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["airflow/providers/datasluice"]
data_file = ".coverage.provider"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 80.00
