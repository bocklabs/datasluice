[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apache-airflow-providers-datasluice"
version = "0.1.0"
description = "Apache Airflow provider for DataSluice open-data discovery, streaming, and materialization"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Nitish Raj", email = "contact@rajnitish.com"}
]
maintainers = [
    {name = "Nitish Raj", email = "contact@rajnitish.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Typing :: Typed",
]
dependencies = [
    "datasluice>=1.0,<2",
    "apache-airflow>=3.2,<4",
]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.datasluice.get_provider_info:get_provider_info"

[project.urls]
bugs = "https://github.com/nitish-raj/datasluice/issues"
changelog = "https://github.com/nitish-raj/datasluice/releases"
documentation = "https://nitish-raj.github.io/datasluice/"
homepage = "https://github.com/nitish-raj/datasluice"

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/airflow/providers/datasluice"]

[tool.hatch.build.targets.sdist]
include = [
    "src/airflow/providers/datasluice",
    "tests",
    "pyproject.toml",
]
