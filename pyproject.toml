[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasluice"
version = "0.3.5"
description = "One Python interface for open-data discovery, extraction, format normalization, and pipeline integration"
readme = "README.md"
authors = [
  {name = "Nitish Raj", email = "contact@bocklabs.com"}
]
maintainers = [
  {name = "Nitish Raj", email = "contact@bocklabs.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "pre-commit",
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "opentelemetry-sdk>=1.44",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.optional-dependencies]
all = ["datasluice[all-connectors,compression,dlt,duckdb,http,keychain,oauth,pandas,parquet,polars,secrets-aws,secrets-vault,storage,telemetry,xlsx]"]
all-connectors = ["datasluice[ckan,udata,socrata]"]
ckan = ["datasluice[http]"]
compression = ["zstandard>=0.23"]
dlt = ["dlt"]
duckdb = ["duckdb"]
http = ["httpx>=0.27"]
keychain = ["keyring>=25.7"]
oauth = []
pandas = ["pandas"]
parquet = ["pyarrow"]
polars = ["polars"]
secrets-aws = ["boto3>=1.43"]
secrets-vault = ["hvac>=2.4"]
socrata = ["datasluice[http]"]
storage = ["fsspec>=2025.1"]
telemetry = ["opentelemetry-api>=1.44"]
udata = ["datasluice[http]"]
xlsx = ["openpyxl"]

[project.urls]
bugs = "https://github.com/bocklabs/datasluice/issues"
changelog = "https://github.com/bocklabs/datasluice/releases"
documentation = "https://bocklabs.github.io/datasluice/"
homepage = "https://github.com/bocklabs/datasluice"

[project.scripts]
datasluice = "datasluice.cli.app:app"

[project.entry-points."datasluice.connectors"]
"datasluice/ckan" = "datasluice.connectors.catalog.ckan.factory:create_ckan_connector"
"datasluice/udata" = "datasluice.connectors.catalog.udata.factory:create_udata_connector"
"datasluice/socrata" = "datasluice.connectors.catalog.socrata.factory:create_socrata_connector"

[tool.ty]

[tool.ty.src]
exclude = ["providers", ".claude"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/e2e/udata_wheel_tracer.py" = ["E401", "E402", "I001"]
"tests/unit/integrations/*" = ["E402"]
"tests/unit/data/*" = ["E402"]
"tests/unit/io/*" = ["E402"]
"tests/unit/runtime/transport/*" = ["E402"]
"tests/unit/runtime/test_transport_httpx.py" = ["E402"]
"tests/unit/transforms/*" = ["E402"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/datasluice"]
data_file = ".coverage.core"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 80.00
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "udata_controlled: integration evidence requiring the local loopback uData evidence stack",
]

[tool.uv]
package = true
default-groups = ["dev"]
