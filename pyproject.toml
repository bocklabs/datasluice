[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasluice"
version = "0.1.0"
description = "One Python interface for open-data discovery, extraction, format normalization, and pipeline integration"
readme = "README.md"
authors = [
  {name = "Nitish Raj", email = "contact@rajnitish.com"}
]
maintainers = [
  {name = "Nitish Raj", email = "contact@rajnitish.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    "pre-commit",
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.optional-dependencies]
pandas = ["pandas"]
polars = ["polars"]
dlt = ["dlt"]
duckdb = ["duckdb"]
parquet = ["pyarrow"]
streaming = ["pyarrow"]
compression = ["zstandard>=0.23"]
xlsx = ["openpyxl"]
http = ["httpx>=0.27"]
storage = ["fsspec>=2025.1"]
all = [
    "pandas",
    "polars",
    "dlt",
    "duckdb",
    "pyarrow",
    "openpyxl",
    "httpx>=0.27",
    "fsspec>=2025.1",
    "zstandard>=0.23",
]

[project.urls]
bugs = "https://github.com/nitish-raj/datasluice/issues"
changelog = "https://github.com/nitish-raj/datasluice/releases"
documentation = "https://nitish-raj.github.io/datasluice/"
homepage = "https://github.com/nitish-raj/datasluice"

[project.scripts]
datasluice = "datasluice.cli.app:app"

[project.entry-points."datasluice.connectors"]
ckan = "datasluice.connectors.ckan.factory:create_ckan_connector"
datagouv = "datasluice.connectors.datagouv.factory:create_datagouv_connector"
socrata = "datasluice.connectors.socrata.factory:create_socrata_connector"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ty.src]
# The Airflow provider is an isolated build root (D-21/D-52) whose host-framework
# dependency (apache-airflow) is deliberately not installed in the core dev venv
# (D-23). Core type-checking excludes it; the provider is type-checked inside the
# wheel-only candidate venv built by providers/apache-airflow/tests/run_candidate.py.
exclude = ["providers"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/datasluice"]
data_file = ".coverage.core"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 80.00
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
package = true
default-groups = ["dev"]
