[mypy]
files = src, scripts, tests
python_version = 3.13
namespace_packages = True
explicit_package_bases = True
mypy_path = src
warn_unused_configs = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True
pretty = False
exclude = (?x)(
    ^providers/
    | ^dist/
    | ^graphify-out/
    | ^site/
    | ^docs/
    | ^dev/
    | \.venv/
  )


[mypy-pyarrow.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-fsspec.*]
ignore_missing_imports = True
follow_imports = skip

